@if (isOpen) {
  <div class="modal-overlay" (click)="onBackdropClick()" (keydown.escape)="onCancel()" tabindex="-1" aria-hidden="true"></div>

  <div class="modal-container">
    <div class="modal-header">
      <div class="header-content">
        <p class="header-label">PROFILE PICTURE</p>
        <h2>Crop your photo</h2>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" title="Close" aria-label="Close dialog">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="cropper-frame">
        <image-cropper
          [imageFile]="file || undefined"
          [maintainAspectRatio]="true"
          [aspectRatio]="1"
          [roundCropper]="true"
          [transform]="transform"
          output="blob"
          format="png"
          (imageCropped)="onImageCropped($event)"
        ></image-cropper>
      </div>

      <div class="zoom-control">
        <span class="material-symbols-outlined" aria-hidden="true">zoom_out</span>
        <input
          type="range"
          min="1"
          max="3"
          step="0.05"
          [ngModel]="zoom"
          (ngModelChange)="onZoomChange($event)"
          aria-label="Zoom"
        />
        <span class="material-symbols-outlined" aria-hidden="true">zoom_in</span>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-create" (click)="onConfirm()">Use photo</button>
    </div>
  </div>
}
