<main class="app-shell">
  <!-- Left Navigation Sidebar -->
  <aside class="sidebar" aria-label="Primary navigation">
    <section class="brand-block">
      <div class="sidebar-logo-mask"></div>
    </section>

    <button type="button" class="btn-primary new-task-button" aria-haspopup="dialog" [attr.aria-expanded]="isTaskModalOpen" (click)="openTaskModal()">
      <span class="material-symbols-outlined button-icon" aria-hidden="true">add</span>
      <span>New Task</span>
    </button>

    <nav class="nav-list">
      <a
        *ngFor="let item of navigationItems"
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-outlined">{{ item.icon }}</span>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>

      <a
        *ngIf="['ADMIN', 'SUPER_ADMIN'].includes(authService.currentUser()?.systemRole ?? '')"
        class="nav-item"
        routerLink="/admin/users"
        routerLinkActive="active"
      >
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-outlined">admin_panel_settings</span>
        </span>
        <span class="nav-label">Admin</span>
      </a>

      <a
        *ngIf="authService.currentUser()?.systemRole === 'SUPER_ADMIN'"
        class="nav-item"
        routerLink="/admin/privilege-groups"
        routerLinkActive="active"
      >
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-outlined">shield_person</span>
        </span>
        <span class="nav-label">Privilege Groups</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="nav-item settings-item">
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-outlined">settings</span>
        </span>
        <span class="nav-label">Settings</span>
      </button>
    </div>
  </aside>

  <!-- Right Content Viewport with Fixed Top Header -->
  <div class="content-wrapper">
    <header class="top-navbar">
      <!-- Column 1: Left Header Slot -->
      <div class="navbar-left"></div>

      <!-- Column 2: Centered Search Bar -->
      <div class="navbar-center">
        <div class="search-container">
          <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
          <input
            type="search"
            placeholder="Search tasks, projects..."
            class="search-input"
            aria-label="Global search"
          />
        </div>
      </div>

      <!-- Column 3: Right Header Actions -->
      <div class="navbar-actions">
        <!-- Theme Toggle -->
        <button
          type="button"
          class="action-btn theme-toggle-btn"
          [attr.aria-label]="themeService.buttonLabel"
          (click)="toggleTheme()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{ themeService.iconName }}</span>
        </button>

        <!-- Notification Bell with Red Badge -->
        <button type="button" class="notification-bell-btn" aria-label="Notifications" routerLink="/notifications">
          <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
          <span class="notification-badge">5</span>
        </button>

        <!-- User Profile Chip Pill -->
        <div class="profile-menu-wrapper">
          <button
            type="button"
            class="user-profile-chip"
            [attr.aria-expanded]="isProfileMenuOpen"
            aria-label="User account menu"
            (click)="toggleProfileMenu()"
          >
            <div class="avatar-circle">
              {{ (authService.currentUser()?.name || 'Hiruni').charAt(0).toUpperCase() }}
            </div>
            <div class="user-meta">
              <span class="user-name">{{ authService.currentUser()?.name || 'Hiruni Wijethilaka' }}</span>
              <span class="user-role-subtitle">Developer • Reviewer • Admin</span>
            </div>
            <span class="material-symbols-outlined dropdown-chevron" aria-hidden="true">expand_more</span>
          </button>

          <!-- User Profile Dropdown Menu -->
          <div class="profile-menu" *ngIf="isProfileMenuOpen">
            <div class="profile-menu-header">
              <span class="profile-menu-name">{{ authService.currentUser()?.name || 'Hiruni Wijethilaka' }}</span>
              <span class="profile-menu-email">{{ authService.currentUser()?.email || 'hiruni@sebsa.com' }}</span>
            </div>
            <button type="button" class="profile-menu-item" (click)="logout()">
              <span class="material-symbols-outlined" aria-hidden="true">logout</span>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </div>

  <app-create-task-modal
    [isOpen]="isTaskModalOpen"
    (closed)="closeTaskModal()"
    (submitted)="handleTaskSaved($event)"
  ></app-create-task-modal>

  <app-toast></app-toast>
</main>
