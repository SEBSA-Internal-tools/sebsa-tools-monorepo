@if (isOpen) {
  <div class="modal-overlay" (click)="onBackdropClick()"></div>

  <div class="modal-container">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2>Create New Project</h2>
      <button type="button" class="close-btn" (click)="onCancel()" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <!-- Project Name Field -->
      <div class="form-group">
        <label for="projectName" class="form-label">
          Project Name <span class="required">*</span>
        </label>
        <input
          id="projectName"
          type="text"
          [(ngModel)]="projectName"
          placeholder="e.g. Q3 Financial Audit Implementation"
          class="form-input"
        />
      </div>

      <!-- Description Field -->
      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          [(ngModel)]="description"
          placeholder="Briefly describe the project goals and scope..."
          class="form-textarea"
          rows="4"
        ></textarea>
      </div>

      <!-- Assign Team Members Field -->
      <div class="form-group">
        <label class="form-label">Assign Team Members</label>

        <!-- Member Search Input -->
        <div class="search-members">
          <span class="material-symbols-outlined search-icon">person_add</span>
          <input
            type="text"
            [(ngModel)]="teamMemberSearch"
            placeholder="Search consultants..."
            class="search-input"
          />
        </div>

        <!-- Selected Members -->
        @if (selectedMembers.length > 0) {
          <div class="selected-members">
            @for (member of selectedMembers; track member.id) {
              <div class="member-tag">
                <div class="member-avatar">{{ member.avatar }}</div>
                <span class="member-name">{{ member.name }}</span>
                <button
                  type="button"
                  class="remove-member"
                  (click)="removeMember(member.id)"
                  title="Remove member"
                >
                  <span class="material-symbols-outlined">close</span>
                </button>
              </div>
            }
          </div>
        }

        <!-- Filtered Members Dropdown -->
        @if (getFilteredMembers().length > 0) {
          <div class="members-dropdown">
            @for (member of getFilteredMembers(); track member.id) {
              <button
                type="button"
                class="member-option"
                (click)="selectMember(member)"
              >
                <div class="member-avatar">{{ member.avatar }}</div>
                <span>{{ member.name }}</span>
              </button>
            }
          </div>
        }
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="button" class="btn-create" (click)="onSubmit()">
        Create Project
      </button>
    </div>
  </div>
}
