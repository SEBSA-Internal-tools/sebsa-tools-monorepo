@if (isOpen) {
  <div class="modal-overlay" (click)="onBackdropClick()"></div>

  <div class="modal-container">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-content">
        <p class="header-label">{{ editData ? 'EDIT' : 'CREATE' }} WORKFLOW STAGE</p>
        <h2>{{ editData ? 'Edit Stage' : 'Add New Stage' }}</h2>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="error-message">
          <span class="material-symbols-outlined">error</span>
          {{ errorMessage() }}
        </div>
      }

      <!-- Stage Name -->
      <div class="form-group full-width">
        <label for="stageName" class="form-label">
          Stage Name <span class="required">*</span>
        </label>
        <input
          id="stageName"
          type="text"
          [(ngModel)]="name"
          placeholder="e.g. In Progress"
          class="form-input"
        />
      </div>

      <!-- Order -->
      <div class="form-group full-width">
        <label for="stageOrder" class="form-label">
          Order / Sequence
        </label>
        <input
          id="stageOrder"
          type="number"
          min="0"
          [(ngModel)]="order"
          class="form-input"
        />
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="button" class="btn-create" (click)="onSubmit()">
        <span class="material-symbols-outlined">{{ editData ? 'save' : 'add' }}</span>
        {{ editData ? 'Save Changes' : 'Add Stage' }}
      </button>
    </div>
  </div>
}
