<div class="team-container">
  <div class="team-header">
    <div class="header-info">
      <h3>Project Team</h3>
      <p class="member-count">{{ teamMembers().length }} members</p>
    </div>
    <button
      type="button"
      class="btn-add-member"
      (click)="onOpenModal()"
      title="Add team member"
    >
      <span class="material-symbols-outlined">person_add</span>
      Add Member
    </button>
  </div>

  <div class="team-grid">
    @for (member of teamMembers(); track member.id) {
      <div class="team-card">
        <!-- Card Header -->
        <div class="card-header">
          <div class="member-avatar">{{ member.avatar }}</div>
          <span class="status-indicator" [class]="getStatusClass(member.status)" [title]="member.status">
            <span class="material-symbols-outlined">{{ getStatusIcon(member.status) }}</span>
          </span>
        </div>

        <!-- Member Info -->
        <div class="member-info">
          <h4>{{ member.name }}</h4>
          <p class="role">{{ member.role }}</p>
          <p class="email">{{ member.email }}</p>
        </div>

        <!-- Join Date -->
        <div class="join-date">
          <span class="material-symbols-outlined">calendar_today</span>
          <span>Joined {{ member.joinDate }}</span>
        </div>


      </div>
    }
  </div>

  <!-- Assign User Modal -->
  <assign-user-modal
    [isOpen]="isModalOpen()"
    [projectId]="projectId"
    (close)="onCloseModal()"
    (submit)="onAssignUsers($event)"
  ></assign-user-modal>
</div>
