@if (project) {
  <div class="project-detail-container">
    <!-- Project Header -->
    <project-detail-header
      [project]="project"
      (backClick)="goBack()"
    ></project-detail-header>

    <!-- Navigation Tabs -->
    <project-nav-tabs
      [activeTab]="activeTab"
      (tabChange)="onTabChange($event)"
      (addTaskClick)="onAddTaskClick()"
    ></project-nav-tabs>

    <!-- Content Area -->
    <div class="detail-content">
      <!-- Kanban Board View -->
      @switch (activeTab) {
        @case ('kanban') {
          <project-kanban [projectId]="project.id"></project-kanban>
        }
        @case ('tasklist') {
          <project-task-list [projectId]="project.id"></project-task-list>
        }
        @case ('overview') {
          <project-overview [project]="project"></project-overview>
        }
        @case ('calendar') {
          <div class="overview-placeholder">
            <span class="material-symbols-outlined">calendar_month</span>
            <h3>Project Calendar</h3>
            <p>Calendar content coming soon</p>
          </div>
        }
        @case ('sprint') {
          <project-sprint [projectId]="project.id"></project-sprint>
        }
        @case ('team') {
          <project-team [projectId]="project.id"></project-team>
        }
      }
    </div>
  </div>
  <!-- Create Task Modal -->
  <create-task-modal
    [isOpen]="isTaskModalOpen"
    [projectId]="project.id"
    [projectName]="project.name"
    (close)="closeTaskModal()"
    (submit)="onCreateTask($event)"
  ></create-task-modal>
} @else {
  <div class="loading">
    <span class="material-symbols-outlined">hourglass_empty</span>
    <p>Loading project...</p>
  </div>
}
