<div class="page-container">
      <!-- Standard Hero Header -->
      <header class="sebsa-page-header">
        <div class="header-content-wrap">
          <div>
            <span class="sebsa-eyebrow">CASE TRACKING & SCHEDULING</span>
            <h1 class="sebsa-page-title">Case Calendar</h1>
            <p class="sebsa-page-desc">
              Track deadlines, sprint commitments, and milestone deliverables across all active customer projects.
            </p>
          </div>

          <div class="header-actions">
            <!-- Project Scope Filter -->
            <select
              [ngModel]="selectedProjectId()"
              (ngModelChange)="onProjectFilterChanged($event)"
              class="project-filter-select"
              aria-label="Scope by Project"
            >
              <option value="">All Accessible Projects</option>
              @for (proj of availableProjects(); track proj.id) {
                <option [value]="proj.id">{{ proj.name }}</option>
              }
            </select>

            <!-- Refresh Button -->
            <button
              type="button"
              class="btn-refresh"
              [class.spinning]="isLoading()"
              (click)="loadCases(true)"
              title="Refresh calendar cases"
            >
              <span class="material-symbols-outlined">refresh</span>
            </button>

            <!-- Schedule Case Button -->
            <button type="button" class="btn-header-primary" (click)="onCreateCaseClicked()">
              <span class="material-symbols-outlined">add</span>
              <span>Schedule Case</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Error Banner -->
      @if (errorMessage()) {
        <div class="calendar-error-banner" role="alert">
          <div class="error-left">
            <span class="material-symbols-outlined">error</span>
            <span>{{ errorMessage() }}</span>
          </div>
          <button type="button" class="btn-retry-banner" (click)="loadCases(true)">
            Retry
          </button>
        </div>
      }

      <!-- KPI Summary Metrics (Real Backend Calculations) -->
      <section class="kpi-cards-grid" aria-label="Calendar Summary Metrics">
        @for (kpi of kpiMetrics(); track kpi.label) {
          <div class="kpi-card">
            <div class="kpi-icon-box" [ngClass]="'variant-' + kpi.colorVariant">
              <span class="material-symbols-outlined">{{ kpi.icon }}</span>
            </div>
            <div class="kpi-content">
              <span class="kpi-value">{{ kpi.value }}</span>
              <span class="kpi-label">{{ kpi.label }}</span>
            </div>
          </div>
        }
      </section>

      <!-- Standalone Calendar Component Connected to Real Data -->
      <main>
        <app-calendar-view
          [items]="calendarCases()"
          [loading]="isLoading()"
          [currentUserId]="authService.currentUser()?.id"
          [currentUserName]="authService.currentUser()?.name"
          (itemClick)="onCaseClicked($event)"
          (createClick)="onCreateForDate($event)"
        ></app-calendar-view>
      </main>

      <!-- Create Case Modal -->
      <app-create-case-modal
        [isOpen]="isCreateCaseModalOpen()"
        [initialDueDate]="initialCaseDueDate()"
        [projectId]="selectedProjectId()"
        [projectName]="selectedProjectName()"
        (closed)="onCaseModalClosed()"
        (submitted)="onCaseFormSubmitted($event)"
      ></app-create-case-modal>
</div>
