@if (isOpen) {
  <div class="modal-overlay" role="presentation" (click)="onBackdropClick()"></div>

  <div class="modal-container">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-content">
        <p class="header-label">EDIT TASK</p>
        <h2>Update task details</h2>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <div class="form-grid">
        <!-- Task Title -->
        <div class="form-group full-width">
          <label for="taskTitle" class="form-label">
            Task Title <span class="required">*</span>
          </label>
          <input
            id="taskTitle"
            type="text"
            [(ngModel)]="taskTitle"
            placeholder="Describe the task..."
            class="form-input"
          />
        </div>

        <!-- Priority -->
        <div class="form-group">
          <div class="form-label" id="priority-label">Priority</div>

          <div
            class="priority-group"
            role="group"
            aria-labelledby="priority-label"
          >
            <button
              type="button"
              class="priority-btn"
              [class.active]="priority === 'CRITICAL' || priority === 'HIGH'"
              (click)="priority = 'HIGH'"
            >
              <span class="priority-dot critical"></span>
              <span>High</span>
            </button>

            <button
              type="button"
              class="priority-btn"
              [class.active]="priority === 'MEDIUM'"
              (click)="priority = 'MEDIUM'"
            >
              <span class="priority-dot medium"></span>
              <span>Med</span>
            </button>

            <button
              type="button"
              class="priority-btn"
              [class.active]="priority === 'LOW'"
              (click)="priority = 'LOW'"
            >
              <span class="priority-dot low"></span>
              <span>Low</span>
            </button>
          </div>
        </div>

        <!-- Start Date -->
        <div class="form-group">
          <label for="startDate" class="form-label">Start Date</label>
          <input
            id="startDate"
            type="date"
            [(ngModel)]="startDate"
            class="form-input"
          />
        </div>

        <!-- Due Date -->
        <div class="form-group">
          <label for="dueDate" class="form-label">Due Date</label>
          <input
            id="dueDate"
            type="date"
            [(ngModel)]="dueDate"
            class="form-input"
          />
        </div>

        <!-- Story Points -->
        <div class="form-group">
          <label for="storyPoints" class="form-label">Story Points</label>
          <input
            id="storyPoints"
            type="number"
            min="0"
            [(ngModel)]="storyPoints"
            placeholder="e.g. 5"
            class="form-input"
          />
        </div>

        <!-- Assignee -->
        <div class="form-group full-width">
          <label for="assignee" class="form-label">Assignee</label>
          <select id="assignee" [(ngModel)]="selectedAssigneeId" class="form-input">
            <option value="">Unassigned</option>
            @for (user of availableAssignees(); track user.id) {
              <option [value]="user.id">{{ user.name }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          [(ngModel)]="description"
          placeholder="Add details, acceptance criteria, or technical notes..."
          class="form-textarea"
          rows="6"
        ></textarea>
      </div>

      <!-- CSO Label -->
      <div class="form-group full-width">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="isCsoLabeled" />
          Tag as CSO — surfaces this task on the CSO Overview page
        </label>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="button" class="btn-create" (click)="onSubmit()">
        Save Changes
      </button>
    </div>
  </div>
}
